[package]
name = "ast"
version = "0.1.0"
edition = "2024"

[features]
default = []
print-clarity = []

[dependencies]
bitflags = { version = "2.10.0", features = ["serde", "std"] }
concat-idents = "1.1.5"
dpscript-macros = { version = "0.1.0", path = "../macros" }
itertools = "0.14.0"
pest = "2.8.5"
serde = { version = "1.0.228", features = ["derive"] }
strum = { version = "0.27.2", features = ["derive"] }
tracing = "0.1.41"
miette = "7.6.0"
