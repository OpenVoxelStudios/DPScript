[package]
name = "dpscript-ast"
version = "0.1.0"
edition = "2024"

[features]
default = []
print-clarity = []

[dependencies]
bitflags = { version = "2.10.0", features = ["serde", "std"] }
itertools = "0.14.0"
pest = "2.8.5"
serde = { version = "1.0.228", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }
tracing = "0.1.41"
miette = "7.6.0"
pastey = "0.2.1"
thiserror = "2.0.18"

dpscript-macros = { path = "../dpscript-macros" }
ordered-float = { version = "5.3.0", features = ["serde"] }
facet = { version = "0.46.0", features = ["ordered-float"] }
dpscript-core = { version = "0.1.0", path = "../dpscript-core" }
better_default = "1.0.5"
