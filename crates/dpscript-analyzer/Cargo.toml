[package]
name = "dpscript-analyzer"
version = "0.1.0"
edition = "2024"

[dependencies]
dpscript-ast = { path = "../dpscript-ast" }
dpscript-core = { path = "../dpscript-core" }
dpscript-lexer = { path = "../dpscript-lexer" }
dpscript-parser = { path = "../dpscript-parser" }
dpscript-tokenizer = { path = "../dpscript-tokenizer" }

itertools = "0.14.0"
indicatif = "0.18.4"
miette = { version = "7.6.0", features = ["fancy"] }
ron = "0.12.1"
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
facet = { version = "0.46.0", features = ["ordered-float"] }
ordered-float = { version = "5.3.0", features = ["serde"] }
parking_lot = { version = "0.12.5", features = ["arc_lock", "owning_ref", "send_guard", "serde"] }

tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
dashmap = "6.2.1"
