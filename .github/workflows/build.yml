on: [workflow_dispatch, push]
name: build

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            windows: false
          - target: aarch64-unknown-linux-gnu
            windows: false
          - target: arm-unknown-linux-gnueabi
            windows: false
          - target: arm-unknown-linux-gnueabihf
            windows: false
          - target: x86_64-unknown-linux-musl
            windows: false
          - target: aarch64-unknown-linux-musl
            windows: false
          - target: arm-unknown-linux-musleabi
            windows: false
          - target: arm-unknown-linux-musleabihf
            windows: false
          # - target: x86_64-apple-darwin
          #   windows: false
          # - target: aarch64-apple-darwin
          #   windows: false
          - target: x86_64-pc-windows-gnu
            windows: true
          - target: i686-pc-windows-gnu
            windows: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          mkdir -p ~/.zig

          curl -fsSL \
            "https://ziglang.org/download/0.13.0/zig-linux-$(uname -m)-0.13.0.tar.xz" | \
            tar -xJ -C ~/.zig --strip-components 1

          chmod a+rx ~/.zig/zig
          sudo ln -sf ~/.zig/zig /usr/local/bin/zig

      - name: Cache
        uses: actions/cache@v4
        env:
          cache-name: rust-cache
        with:
          path: |
            ~/.cargo
            ~/.rustup
            target
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-${{ matrix.target }}-
            ${{ runner.os }}-build-${{ matrix.target }}-
            ${{ runner.os }}-${{ matrix.target }}-

      - name: Install Rust toolchain
        run: |
          rustup update --no-self-update nightly
          rustup component add --toolchain nightly rustfmt rust-src
          rustup default nightly

          rustup target add ${{ matrix.target }}

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-zigbuild
        run: |
          cargo binstall cargo-zigbuild -y

      - name: Install cross
        run: |
          cargo binstall cross -y

      - name: Build
        if: matrix.windows != true
        run: |
          cargo zigbuild --workspace --bins --target ${{ matrix.target }}
          cargo zigbuild --workspace --bins --release --target ${{ matrix.target }}

          mkdir bin

          cp -v target/${{ matrix.target }}/debug/dpscript-analyzer bin/dpscript-analyzer-debug
          cp -v target/${{ matrix.target }}/release/dpscript-analyzer bin/dpscript-analyzer

          cp -v target/${{ matrix.target }}/debug/dpscript-lsp bin/dpscript-lsp-debug
          cp -v target/${{ matrix.target }}/release/dpscript-lsp bin/dpscript-lsp

          cp -v target/${{ matrix.target }}/debug/dpscript-tokenizer bin/dpscript-tokenizer-debug
          cp -v target/${{ matrix.target }}/release/dpscript-tokenizer bin/dpscript-tokenizer

          cp -v target/${{ matrix.target }}/debug/dpscript-lexer bin/dpscript-lexer-debug
          cp -v target/${{ matrix.target }}/release/dpscript-lexer bin/dpscript-lexer

          cp -v target/${{ matrix.target }}/debug/dpscript-parser bin/dpscript-parser-debug
          cp -v target/${{ matrix.target }}/release/dpscript-parser bin/dpscript-parser

          cp -v target/${{ matrix.target }}/debug/dsc bin/dsc-debug
          cp -v target/${{ matrix.target }}/release/dsc bin/dsc

      - name: Build (windows)
        if: matrix.windows == true
        run: |
          cross build --workspace --bins --target ${{ matrix.target }}
          cross build --workspace --bins --release --target ${{ matrix.target }}

          mkdir bin

          cp -v target/${{ matrix.target }}/debug/dpscript-analyzer.exe bin/dpscript-analyzer-debug.exe
          cp -v target/${{ matrix.target }}/release/dpscript-analyzer.exe bin/dpscript-analyzer.exe

          cp -v target/${{ matrix.target }}/debug/dpscript-lsp.exe bin/dpscript-lsp-debug.exe
          cp -v target/${{ matrix.target }}/release/dpscript-lsp.exe bin/dpscript-lsp.exe

          cp -v target/${{ matrix.target }}/debug/dpscript-tokenizer.exe bin/dpscript-tokenizer-debug.exe
          cp -v target/${{ matrix.target }}/release/dpscript-tokenizer.exe bin/dpscript-tokenizer.exe

          cp -v target/${{ matrix.target }}/debug/dpscript-lexer.exe bin/dpscript-lexer-debug.exe
          cp -v target/${{ matrix.target }}/release/dpscript-lexer.exe bin/dpscript-lexer.exe

          cp -v target/${{ matrix.target }}/debug/dpscript-parser.exe bin/dpscript-parser-debug.exe
          cp -v target/${{ matrix.target }}/release/dpscript-parser.exe bin/dpscript-parser.exe

          cp -v target/${{ matrix.target }}/debug/dsc.exe bin/dsc-debug.exe
          cp -v target/${{ matrix.target }}/release/dsc.exe bin/dsc.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: bin/*
  merge:
    name: Merge Artifacts
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      
      - name: Merge artifacts
        run: |
          mkdir bin

          for target in ./artifacts/*; do
            targetname="$(basename "$target")"
            targetname="${targetname/binaries-/}"

            for file in $target/*; do
              if [[ "$file" == *".exe" ]]; then
                newpath="${file/\.exe/"-$targetname.exe"}"
                newpath="./bin/$(basename "$newpath")"

                cp -v "$file" "$newpath"
              else
                newpath="$file-$targetname"
                newpath="./bin/$(basename "$newpath")"

                cp -v "$file" "$newpath"
              fi
            done
          done
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/*
