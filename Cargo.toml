[package]
name = "dpscript"
version = "0.3.0"
edition = "2024"
description = "A transpiled programming language to aid in Minecraft datapack development."
license = "MIT"
repository = "https://github.com/RedstoneWizard08/DPScript"

[[bin]]
name = "dsc"
path = "src/bin/dsc.rs"

[[bin]]
name = "dscls"
path = "src/bin/lsp.rs"

[dependencies]
anyhow = { version = "1.0.100", features = ["backtrace"] }
bitflags = { version = "2.9.4", features = ["serde", "std"] }
clap = { version = "4.5.49", features = ["derive"] }
clap-verbosity-flag = { version = "3.0.4", default-features = false, features = ["tracing"] }
colored = "3.0.0"
concat-idents = "1.1.5"
indicatif = "0.18.0"
itertools = "0.14.0"
json5 = "0.4.1"
miette = { version = "7.6.0", features = ["fancy", "serde", "syntect-highlighter"] }
once_cell = "1.21.3"
ron = "0.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
strum = { version = "0.27.2", features = ["derive"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
toml = "0.9.8"
tower-lsp = "0.20.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["ansi", "env-filter", "registry"] }
uuid = { version = "1.18.1", features = ["v4"] }
walkdir = "2.5.0"

dpscript-ast = { path = "./crates/dpscript-ast" }
dpscript-lexer = { path = "./crates/dpscript-lexer" }
dpscript-macros = { path = "./crates/dpscript-macros" }
dpscript-tokenizer = { path = "./crates/dpscript-tokenizer" }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/dsc-{ target }"
pkg-fmt = "bin"

[workspace]
resolver = "2"
members = [".", "crates/*"]

[features]
default = []
print-clarity = []

[profile.bench]
debug = true
