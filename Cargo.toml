[package]
name = "dpscript"
version = "0.3.0"
edition = "2024"
description = "A transpiled programming language to aid in Datapack development."
license = "MIT"
repository = "https://github.com/RedstoneWizard08/DPScript"

[[bin]]
name = "dsc"
path = "src/bin/dsc.rs"

[[bin]]
name = "dscls"
path = "src/bin/lsp.rs"

[dependencies]
bitflags = { version = "2.9.3", features = ["serde", "std"] }
clap = { version = "4.5.39", features = ["derive"] }
indicatif = "0.17.11"
json5 = "0.4.1"
miette = { version = "7.6.0", features = ["fancy", "serde"] }
once_cell = "1.21.3"
regex = "1.11.1"
ron = "0.10.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["full"] }
toml = "0.8.22"
tower-lsp = "0.20.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["ansi", "env-filter", "registry"] }
uuid = { version = "1.17.0", features = ["v4"] }
walkdir = "2.5.0"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/dsc-{ target }"
pkg-fmt = "bin"
